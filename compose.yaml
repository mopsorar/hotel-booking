services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python src/manage.py migrate && python src/manage.py runserver 0.0.0.0:9000

volumes:
  postgres_data:
