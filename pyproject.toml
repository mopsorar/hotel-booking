[project]
name = "hotel-booking"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-o pythonpath=src"
python_files = ["test_*.py", "*_test.py"]
