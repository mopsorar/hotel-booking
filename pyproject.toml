[project]
name = "hotel-booking"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-o pythonpath=src"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = ["src/booking/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["booking", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"